<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Telecaller CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d2ab5b; --gold-deep:#c39f48; --gold-soft:#f4ead2;
  --bg:#eceef1; --card:#fff; --ink:#20242b; --muted:#8b919b; --faint:#aeb4bd;
  --line:#ececed; --line-2:#f3f3f5; --rose:#fbe9e8;
  --green:#2f9e57; --green-bg:#def4e5;
  --blue:#3b6fd4;  --blue-bg:#e6edfb;
  --red:#d9534f;   --red-bg:#fbe7e6;
  --amber:#d98a2b; --amber-bg:#fbeed8;
  --purple:#7c5cd6;--purple-bg:#ece6fa;
  --slate:#5a6472; --slate-bg:#eef0f3;
  --shadow:0 1px 2px rgba(20,24,31,.04), 0 6px 18px rgba(20,24,31,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:#d9dde2;color:var(--ink);
  display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
.phone{width:100%;max-width:412px;height:100vh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:460px){.phone{height:calc(100vh - 28px);margin:14px 0;border-radius:30px;box-shadow:0 24px 70px rgba(0,0,0,.35)}}

.statusbar{background:#16181c;color:#fff;height:32px;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;font-size:12.5px;font-weight:600;flex-shrink:0;z-index:5}
.statusbar .icons{display:flex;gap:6px;align-items:center;font-size:11px;opacity:.92}
.bat{width:19px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative;display:inline-block}
.bat::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#fff;border-radius:0 1px 1px 0}
.bat::before{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:55%;background:#fff;border-radius:1px}

.appbar{background:var(--gold);color:#fff;flex-shrink:0;padding:15px 18px;display:flex;align-items:center;gap:13px;z-index:4}
.appbar .ic{cursor:pointer;display:flex;opacity:.95}
.appbar .ttl{flex:1;min-width:0}
.appbar h1{font-family:'Outfit';font-size:20px;font-weight:600;letter-spacing:.2px;line-height:1.1}
.appbar .sub{font-size:11.5px;opacity:.85;margin-top:2px;font-weight:500}

/* screens */
.stage-wrap{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.3,.85,.35,1);visibility:hidden}
.screen.active{transform:translateX(0);visibility:visible}
.screen.under{transform:translateX(-22%);visibility:visible}
.scroll{flex:1;overflow-y:auto;padding:14px 14px 92px}
.scroll.noNav{padding-bottom:110px}
.scroll::-webkit-scrollbar{width:0}

.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:15px;margin-bottom:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.pill .d{width:7px;height:7px;border-radius:50%}
.b-blue{background:var(--blue-bg);color:var(--blue)} .b-amber{background:var(--amber-bg);color:var(--amber)}
.b-green{background:var(--green-bg);color:var(--green)} .b-purple{background:var(--purple-bg);color:var(--purple)}
.b-red{background:var(--red-bg);color:var(--red)} .b-slate{background:var(--slate-bg);color:var(--slate)}
.b-gold{background:var(--gold-soft);color:#9a7a2f}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 11px}
.sec-head h2{font-family:'Outfit';font-size:15px;font-weight:600}
.sec-head .meta,.sec-head a{font-size:11.5px;color:var(--faint);font-weight:500;text-decoration:none;cursor:pointer}
.sec-head a{color:var(--gold-deep);font-weight:600}
.divider{height:1px;background:var(--line);margin:13px 0}

/* ===== HOME ===== */
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px}
.hs{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.hs .n{font-family:'Outfit';font-size:24px;font-weight:600;line-height:1}
.hs .t{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:6px}
.hs .ic{float:right;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-top:-2px}
.perf{display:flex;gap:11px}
.perf .pbox{flex:1;text-align:center;background:var(--line-2);border-radius:13px;padding:11px 6px}
.perf .pbox b{display:block;font-family:'Outfit';font-size:18px;font-weight:600}
.perf .pbox span{font-size:10px;color:var(--muted);font-weight:500}
.fu-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.fu-row:last-child{border-bottom:none}
.fu-av{width:40px;height:40px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Outfit';font-weight:600;font-size:15px;color:#fff}
.fu-info{flex:1;min-width:0}
.fu-info .nm{font-size:13.5px;font-weight:600}
.fu-info .sb{font-size:11.5px;color:var(--muted);margin-top:1px}
.fu-time{font-size:11px;font-weight:600;text-align:right}

/* ===== CUSTOMER LIST ===== */
.search{display:flex;align-items:center;gap:9px;background:var(--card);border-radius:14px;padding:11px 14px;
  box-shadow:var(--shadow);margin-bottom:11px}
.search input{border:none;outline:none;font-family:inherit;font-size:14px;flex:1;background:none;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:11px;margin:0 -14px;padding-left:14px;padding-right:14px}
.chips::-webkit-scrollbar{height:0}
.chip{flex-shrink:0;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:8px 14px;
  font-size:12.5px;font-weight:600;color:var(--slate);cursor:pointer;white-space:nowrap;font-family:'Outfit'}
.chip.active{background:var(--gold);border-color:var(--gold);color:#fff}
.cust{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:11px;cursor:pointer;
  border-left:4px solid transparent}
.cust:active{transform:scale(.99)}
.cust-h{display:flex;align-items:flex-start;gap:11px}
.cust-h .av{width:44px;height:44px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Outfit';font-weight:600;font-size:16px;color:#fff}
.cust-nm{font-family:'Outfit';font-size:15.5px;font-weight:600;line-height:1.15}
.cust-co{font-size:12px;color:var(--muted);margin-top:2px}
.cust-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cust-foot{display:flex;justify-content:space-between;margin-top:11px;padding-top:11px;border-top:1px solid var(--line-2)}
.cf{font-size:10.5px;color:var(--faint);font-weight:500}
.cf b{display:block;font-family:'Outfit';font-size:13px;font-weight:600;color:var(--ink);margin-top:2px}
.score-ring{width:38px;height:38px;flex-shrink:0;position:relative}
.score-ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Outfit';font-size:12px;font-weight:600}

/* ===== PIPELINE ===== */
.stage-tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;margin:0 -14px;padding-left:14px;padding-right:14px}
.stage-tabs::-webkit-scrollbar{height:0}
.stab{flex-shrink:0;border-radius:13px;padding:10px 13px;cursor:pointer;text-align:center;min-width:84px;
  border:1.5px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.stab .sn{font-family:'Outfit';font-size:11px;font-weight:600;color:var(--slate)}
.stab .sc{font-family:'Outfit';font-size:20px;font-weight:600;margin-top:3px}
.stab.active{color:#fff}

/* ===== PROFILE ===== */
.psum{display:flex;align-items:flex-start;gap:13px}
.psum .av{width:54px;height:54px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:'Outfit';font-weight:600;font-size:21px;color:#fff}
.psum .nm{font-family:'Outfit';font-size:19px;font-weight:600;line-height:1.1}
.psum .co{font-size:12.5px;color:var(--muted);margin-top:3px}
.psum .right{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.qa-row{display:flex;justify-content:space-between;gap:4px;margin-top:15px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;cursor:pointer;background:none;border:none;font-family:inherit}
.qa .qi{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.qa:active .qi{transform:scale(.9)}
.qa .ql{font-size:10px;color:var(--muted);font-weight:500}

/* journey stepper */
.journey{display:flex;align-items:center;margin:4px 0}
.jstep{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.jstep .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;background:var(--line);z-index:2;font-family:'Outfit'}
.jstep .lab{font-size:8.5px;color:var(--faint);font-weight:600;margin-top:5px;text-align:center;line-height:1.1}
.jstep .bar{position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--line);z-index:1}
.jstep:first-child .bar{display:none}
.jstep.done .dot{background:var(--green)} .jstep.done .bar{background:var(--green)}
.jstep.cur .dot{box-shadow:0 0 0 4px rgba(210,171,91,.25)}
.jstep.cur .lab{color:var(--ink)}

.ptabs{display:flex;gap:7px;margin-bottom:13px}
.ptab{flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;
  font-family:'Outfit';font-size:12px;font-weight:600;color:var(--slate);cursor:pointer;box-shadow:var(--shadow)}
.ptab.active{background:var(--gold);border-color:var(--gold);color:#fff}
.ppane{display:none}.ppane.active{display:block}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px 12px}
.info-grid .full{grid-column:1/-1}
.il{font-size:10px;color:var(--faint);font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.iv{font-size:13.5px;color:var(--ink);font-weight:500;margin-top:3px;word-break:break-word}
.iv a{color:var(--blue);text-decoration:none}

.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kpi{background:var(--line-2);border-radius:13px;padding:11px 6px;text-align:center}
.kpi .kn{font-family:'Outfit';font-size:17px;font-weight:600;line-height:1}
.kpi .kt{font-size:9.5px;color:var(--muted);font-weight:500;margin-top:5px}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.stat{background:var(--line-2);border-radius:12px;padding:10px 4px;text-align:center}
.stat .n{font-family:'Outfit';font-size:17px;font-weight:600;line-height:1}
.stat .t{font-size:9px;color:var(--muted);font-weight:500;margin-top:5px}
.stat.ok .n{color:var(--green)} .stat.miss .n{color:var(--red)} .stat.busy .n{color:var(--amber)}

.daygroup{margin-bottom:4px}
.dayhdr{display:flex;align-items:center;gap:7px;margin:4px 2px 9px}
.dayhdr .date{font-family:'Outfit';font-size:12.5px;font-weight:600}
.dayhdr .cnt{font-size:10.5px;color:var(--faint);font-weight:500}
.attempt{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.attempt:last-child{border-bottom:none}
.adot{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.ab{flex:1;min-width:0}.at{font-size:12.5px;font-weight:600}.atm{font-size:10.5px;color:var(--faint);margin-top:1px}
.adur{font-size:11px;font-weight:600;color:var(--green)}

.note{padding:12px 0;border-bottom:1px solid var(--line-2)}.note:last-child{border-bottom:none}
.note .nh{display:flex;justify-content:space-between;margin-bottom:5px}
.note .who{font-size:11.5px;font-weight:600}.note .when{font-size:10.5px;color:var(--faint)}
.note .bd{font-size:12.5px;color:#404650;line-height:1.5}
.note .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.mt{font-size:9.5px;font-weight:600;padding:3px 7px;border-radius:7px;background:var(--line-2);color:var(--slate)}
.addrow{display:flex;gap:8px;margin-top:13px}
.addrow input{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-family:inherit;font-size:13px;outline:none}
.addrow input:focus{border-color:var(--gold)}
.btn-sm{background:var(--gold);color:#fff;border:none;border-radius:11px;padding:0 15px;font-family:'Outfit';font-weight:600;font-size:13px;cursor:pointer}

.order{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.order:last-child{border-bottom:none}
.oico{width:38px;height:38px;border-radius:11px;background:var(--gold-soft);color:#a07d2f;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ob{flex:1;min-width:0}.oinv{font-size:13px;font-weight:600}.odesc{font-size:11px;color:var(--muted);margin-top:1px}
.oamt{text-align:right}.oamt b{font-family:'Outfit';font-size:14px;font-weight:600;display:block}

.tl{position:relative;padding-left:6px}
.tl-item{position:relative;padding:0 0 16px 28px}
.tl-item::before{content:"";position:absolute;left:12px;top:21px;bottom:-3px;width:2px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-ic{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px}
.tl-t{font-size:12.5px;font-weight:600}.tl-d{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.tl-tm{font-size:10.5px;color:var(--faint);margin-top:3px}

.fup-card{border:1.5px solid var(--gold-soft);background:#fdfaf2;border-radius:14px;padding:13px;margin-bottom:11px}
.fup-card.miss{border-color:var(--red-bg);background:#fdf5f4}
.fup-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.fup-when{font-family:'Outfit';font-size:13.5px;font-weight:600}
.fup-purpose{font-size:12.5px;color:#404650;line-height:1.45}
.fup-row{display:flex;gap:14px;margin-top:9px;font-size:11px;color:var(--muted)}
.fup-row b{color:var(--ink);font-weight:600}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.field label{font-size:10px;color:var(--faint);font-weight:600;letter-spacing:.3px;text-transform:uppercase;display:block;margin-bottom:5px}
.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 11px;font-family:inherit;font-size:13px;outline:none;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus{border-color:var(--gold)}
.btn-full{width:100%;background:var(--gold);color:#fff;border:none;border-radius:13px;padding:13px;font-family:'Outfit';font-weight:600;font-size:14px;cursor:pointer}
.btn-full:active{background:var(--gold-deep)}
.btn-out{background:#fff;border:1.5px solid var(--gold);color:var(--gold-deep)}

/* analytics */
.seg{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.seg:last-child{border-bottom:none}
.seg .si{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.seg .sb{flex:1}.seg .st{font-size:13.5px;font-weight:600}.seg .sd{font-size:11.5px;color:var(--muted);margin-top:1px}
.seg .sn{font-family:'Outfit';font-size:20px;font-weight:600}

/* footer + nav */
.pfoot{position:absolute;left:0;right:0;bottom:0;padding:12px 14px 16px;background:linear-gradient(to top,var(--bg) 72%,rgba(236,238,241,0));display:flex;gap:9px;z-index:6}
.fbtn{flex:1;border:none;border-radius:15px;padding:14px;font-family:'Outfit';font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.fbtn.primary{background:var(--gold);color:#fff;box-shadow:0 6px 16px rgba(210,171,91,.4)}
.fbtn.primary:active{background:var(--gold-deep)}
.fbtn.ghost{flex:0 0 54px;background:var(--green-bg);color:var(--green)}

.navbar{flex-shrink:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 6px 14px;z-index:7}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;font-family:inherit;color:var(--faint);padding:5px 0}
.nav.active{color:var(--gold-deep)}
.nav .nl{font-size:10px;font-weight:600}

/* sheets */
.sheet-ov{position:absolute;inset:0;background:rgba(20,24,31,.42);opacity:0;pointer-events:none;transition:.22s;z-index:40}
.sheet-ov.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:8px 18px 22px;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.9,.3,1);z-index:41;max-height:90%;overflow-y:auto}
.sheet.show{transform:translateY(0)}
.sheet::-webkit-scrollbar{width:0}
.grab{width:42px;height:4px;background:#dfe2e6;border-radius:3px;margin:8px auto 16px}
.sheet h3{font-family:'Outfit';font-size:17px;font-weight:600;margin-bottom:3px}
.sheet .ssub{font-size:12px;color:var(--muted);margin-bottom:15px}
.oc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.oc{border:1.5px solid var(--line);border-radius:12px;padding:11px;font-family:inherit;font-size:12.5px;font-weight:600;
  cursor:pointer;background:#fff;text-align:left;display:flex;align-items:center;gap:8px;color:var(--ink)}
.oc .od{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.oc.sel{border-color:var(--gold);background:var(--gold-soft)}
.sheet textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px;font-family:inherit;font-size:13px;resize:none;outline:none;margin-bottom:13px}
.sheet textarea:focus{border-color:var(--gold)}

.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#20242b;color:#fff;
  padding:11px 20px;border-radius:30px;font-size:12.5px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;
  white-space:nowrap;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:30px 10px}
svg{display:block}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>5:48</span><span class="icons">5G ▪▪▪▫ <span class="bat"></span></span></div>

  <!-- top app bar (changes per screen) -->
  <div class="appbar" id="appbar">
    <span class="ic" id="abBack" style="display:none" onclick="back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></span>
    <div class="ttl"><h1 id="abTitle">Dashboard</h1><div class="sub" id="abSub">Thursday · 25 Jun 2026</div></div>
    <span class="ic" id="abAction" onclick="reloadView()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></span>
  </div>

  <div class="stage-wrap">
    <!-- HOME -->
    <div class="screen active" id="s-home"><div class="scroll" id="homeScroll"></div></div>
    <!-- CUSTOMERS -->
    <div class="screen" id="s-cust"><div class="scroll" id="custScroll"></div></div>
    <!-- PIPELINE -->
    <div class="screen" id="s-pipe"><div class="scroll" id="pipeScroll"></div></div>
    <!-- ANALYTICS -->
    <div class="screen" id="s-ana"><div class="scroll" id="anaScroll"></div></div>
    <!-- PROFILE -->
    <div class="screen" id="s-prof">
      <div class="scroll noNav" id="profScroll"></div>

function ring(score,col){const r=15,c=2*Math.PI*r,off=c-(score/100)*c;
  return `<svg width="38" height="38" viewBox="0 0 38 38"><circle cx="19" cy="19" r="${r}" fill="none" stroke="var(--line)" stroke-width="3.5"/>
    <circle cx="19" cy="19" r="${r}" fill="none" stroke="${col}" stroke-width="3.5" stroke-linecap="round"
    stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 19 19)"/></svg>`;}
function fmtDate(d){if(!d||d==='—')return '—';const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function renderLog(c){return c.log.map(d=>`

function outMap(o){const m={'Answered':['var(--green-bg)','var(--green)','✓'],'No Answer':['var(--red-bg)','var(--red)','✕'],
  'Missed':['var(--red-bg)','var(--red)','✕'],'Busy':['var(--amber-bg)','var(--amber)','‖'],'Switched Off':['var(--slate-bg)','var(--slate)','⏻'],

  return m[o]||['var(--gold-soft)','#a07d2f','•'];}
function noteHtml(n){return `<div class="note"><div class="nh"><span class="who">${esc(n.who)}</span><span class="when">${n.when}</span></div>
  <div class="bd">${esc(n.bd)}</div>${n.tags&&n.tags.length?`<div class="tags">${n.tags.map(t=>`<span class="mt">${esc(t)}</span>`).join('')}</div>`:''}</div>`;}
function tlHtml(t){const cm={blue:['var(--blue-bg)','var(--blue)'],green:['var(--green-bg)','var(--green)'],amber:['var(--amber-bg)','var(--amber)'],
  slate:['var(--slate-bg)','var(--slate)'],red:['var(--red-bg)','var(--red)'],gold:['var(--gold-soft)','#a07d2f'],purple:['var(--purple-bg)','var(--purple)']}[t.c]||['var(--gold-soft)','#a07d2f'];

  'Pending Approval':'b-amber','Packed':'b-blue','Cancelled':'b-red','Returned':'b-red'}[o.status]||'b-slate';
  return `<div class="order"><div class="oico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg></div>

  if(!val){toast('Type a note first');return;}
  const now=new Date(), when=now.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' · '+now.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true});
  c.notes.unshift({who:telecaller.name,when,bd:val,tags:[]});
  c.timeline.unshift({ic:'📝',c:'slate',t:'Note added',d:val.slice(0,42),tm:'Today · '+now.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true})});
  if(profTab==='activity')renderProfPane();
  if(!silent)toast('Note added');
}
function scheduleFup(){
  const c=cust(curId), d=document.getElementById('fD').value, t=document.getElementById('fT').value;
  if(!d||!t){toast('Set date & time');return;}
  const p=document.getElementById('fP').value, r=document.getElementById('fR').value, pur=document.getElementById('fPur').value.trim()||'Follow-up call';
  const dt=new Date(d+'T'+t), nice=dt.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' · '+dt.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true});
  c.followups.next={when:nice,prio:p,rem:r,purpose:pur,miss:false}; c.next=d;
  c.timeline.unshift({ic:'📅',c:'gold',t:'Follow-up scheduled',d:nice+' — '+pur.slice(0,30),tm:'Just now'});
  renderProfPane(); toast('Follow-up scheduled');
}
function advanceStage(){
  const c=cust(curId), i=stIdx(c.stage);
  if(i>=STAGES.length-1){toast('Already at the final stage');return;}
  c.stage=STAGES[i+1].k;
  c.timeline.unshift({ic:'⬆️',c:stOf(c.stage).c,t:'Moved to '+stOf(c.stage).n,d:'Stage advanced',tm:'Just now'});
  renderProfile(); toast('Stage → '+stOf(c.stage).n);
}

/* ============ SHEETS ============ */
const OUTCOMES=[['No Answer','#d9534f'],['Busy','#d98a2b'],['Switched Off','#5a6472'],['Wrong Number','#d9534f'],
  ['Call Back Later','#3b6fd4'],['Interested','#2f9e57'],['Not Interested','#d9534f'],['Follow-up Required','#d98a2b'],
  ['Demo Scheduled','#3b6fd4'],['Meeting Scheduled','#3b6fd4'],['Proposal Sent','#a07d2f'],['Converted','#2f9e57']];
function openSheet(type){
  const c=cust(curId), b=document.getElementById('sheetBody');
  if(type==='outcome'){selOutcome=null;
    b.innerHTML=`<h3>Log call outcome</h3><div class="ssub">${esc(c.name)} · ${esc(c.co)} · just now</div>
      <div class="oc-grid">${OUTCOMES.map(([n,col])=>`<button class="oc" data-o="${n}" onclick="pickOutcome(this,'${n}')"><span class="od" style="background:${col}"></span>${n}</button>`).join('')}</div>
      <textarea id="ocNote" rows="2" placeholder="Add a note for this call (optional)…"></textarea>
      <button class="btn-full" onclick="saveOutcome()">Save outcome</button>`;
  } else if(type==='order'){
    b.innerHTML=`<h3>Create order</h3><div class="ssub">${esc(c.name)} · ${esc(c.co)}</div>
      <div class="field" style="margin-bottom:11px"><label>Products / items</label><input id="oItems" placeholder="e.g. Staples + oils · 12 SKUs"></div>
      <div class="form-row"><div class="field"><label>Order value (₹)</label><input id="oAmt" type="number" inputmode="numeric" placeholder="0"></div>
        <div class="field"><label>Payment</label><select id="oPay"><option>Paid</option><option>Partial</option><option>Pending</option></select></div></div>
      <div class="field" style="margin-bottom:13px"><label>Status</label><select id="oStatus"><option>Draft</option><option>Pending Approval</option><option selected>Confirmed</option><option>Processing</option><option>Packed</option><option>Shipped</option><option>Delivered</option></select></div>
      <button class="btn-full" onclick="createOrder()">Create order</button>
      <button class="btn-full btn-out" style="margin-top:9px" onclick="closeSheet()">Cancel</button>`;
  }
  document.getElementById('ov').classList.add('show');document.getElementById('sheet').classList.add('show');
}
function closeSheet(){document.getElementById('ov').classList.remove('show');document.getElementById('sheet').classList.remove('show');}
function pickOutcome(el,n){document.querySelectorAll('.oc').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');selOutcome=n;}
function saveOutcome(){
  if(!selOutcome){toast('Pick an outcome first');return;}
  const c=cust(curId), note=document.getElementById('ocNote').value.trim();
  const now=new Date(), time=now.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true});
  // add to today's log
  let day=c.log.find(d=>d.today);
  if(!day){day={date:'25 June 2026',today:true,items:[]};c.log.unshift(day);}
  const att=day.items.length+1, entry={o:selOutcome,t:time,a:att};
  if(selOutcome==='Answered'||selOutcome==='Converted')entry.dur='3m 00s';
  day.items.unshift(entry);
  // stats
  c.calls.total++; c.calls.outgoing++;
  if(selOutcome==='Busy')c.calls.busy++; else if(selOutcome==='No Answer')c.calls.missed++;
  else if(selOutcome==='Switched Off')c.calls.off++; else if(selOutcome==='Wrong Number')c.calls.wrong++;
  else c.calls.answered++;
  c.calls.lastAt='25 Jun · '+time;
  // timeline
  const m=outMap(selOutcome);
  c.timeline.unshift({ic:'📞',c:m[1].includes('green')?'green':'gold',t:'Outcome: '+selOutcome,d:note||'',tm:'Today · '+time});
  if(note)addNote(note,true);
  // stage logic
  const adv={'Interested':'potential','Proposal Sent':'potential','Demo Scheduled':'potential','Meeting Scheduled':'potential','Converted':'conversion'}[selOutcome];
  if(adv && stIdx(c.stage)<stIdx(adv)){c.stage=adv;toast('Outcome saved · stage → '+stOf(adv).n);}
  else toast('Outcome saved · '+selOutcome);
  closeSheet(); renderProfile();
}
function createOrder(){
  const c=cust(curId), items=document.getElementById('oItems').value.trim()||'Order items',
    amt=parseInt(document.getElementById('oAmt').value)||0, pay=document.getElementById('oPay').value, status=document.getElementById('oStatus').value;
  if(amt<=0){toast('Enter an order value');return;}
  const inv='INV-'+(20600+Math.floor(Math.random()*399)), date='25 Jun 2026';
  c.orders.push({inv,date,items,amt,status,pay,del:status});
  c.revenue+=amt;
  c.timeline.unshift({ic:'🛒',c:'green',t:'Order · '+money(amt),d:inv+' '+status.toLowerCase(),tm:'Today'});
  // stage logic
  if(stIdx(c.stage)<stIdx('conversion'))c.stage='conversion';
  else if(c.orders.length>=2 && c.stage==='conversion')c.stage='repeat';
  closeSheet(); renderProfile();
  toast('Order created · '+money(amt));
}

/* ============ TOAST ============ */
let tT; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2000);}

/* init */
go('cust');
</script>
