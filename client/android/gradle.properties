# 2G heap: this 16GB machine chronically OOM-crashed Gradle daemons at 4G
# (hs_err_pid* logs) once servers + IDE + emulators are also running.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:G1NewCollectionHeuristicPercent=20 -XX:G1ReservePercent=20 -XX:MaxGCPauseMillis=100
android.useAndroidX=true
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.daemon.jvmargs=-Xmx2G
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
